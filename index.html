<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stroke Coach</title>
<link rel="manifest" href="manifest.webmanifest?v=20260910174331">
<link rel="stylesheet" href="css/main.css?v=20260910174331">
<style>
/* CRITICAL INLINE CSS — ships separately from main.css so a failed/missing
   stylesheet fetch can never render the app as a broken white page
   (Bence's Firefox Android screenshot, 09-10). main.css overrides everything. */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #0b0f14; color: #e8edf2;
  font-family: system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto;
  padding: 12px env(safe-area-inset-right) calc(20px + env(safe-area-inset-bottom)); }
button.primary { font-size: 28px; padding: 18px 48px; border-radius: 12px;
  border: none; background: #1652f0; color: white; width: 100%; }
</style>
</head>
<body>
  <main>
    <button id="startBtn" class="primary">START</button>

    <section id="dashboard" hidden>
      <div class="big" id="speed">--<span class="unit"> km/h</span></div>
      <div class="big" id="spm">--<span class="unit"> spm</span></div>
      <div class="metrics">
        <div><span id="pace">--:--</span><label>pace /500m</label></div>
        <div><span id="dist">0</span><label>distance m</label></div>
        <div><span id="elapsed">0:00</span><label>elapsed</label></div>
        <div><span id="gps">no fix</span><label>gps</label></div>
      </div>
      <canvas id="scope" width="320" height="120"></canvas>
      <canvas id="curve" width="320" height="100"></canvas>
      <button id="stopBtn">STOP &amp; SAVE</button>
    </section>

    <section id="history" hidden>
      <h2>Sessions</h2>
      <ul id="sessionList"></ul>
      <button id="clearBtn">Clear history</button>
    </section>

    <section id="devtools">
      <button id="exportBtn" hidden>Export raw CSV</button>
    </section>
  </main>
  <script src="js/stroke-detector.js?v=20260910174331"></script>
<script src="js/stroke-tracker.js?v=20260910174331"></script>
<script src="js/app.js?v=20260910174331"></script>
</body>
</html>
