<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stroke Coach</title>
<link rel="manifest" href="manifest.webmanifest?v=20260912110220">
<link rel="stylesheet" href="css/main.css?v=20260912110220">
<style>
/* CRITICAL INLINE CSS — ships separately from main.css so a failed/missing
   stylesheet fetch can never render the app as a broken white page
   (Bence's Firefox Android screenshot, 09-10). main.css overrides everything. */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #0b0f14; color: #e8edf2;
  font-family: system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto;
  padding: 12px env(safe-area-inset-right) calc(20px + env(safe-area-inset-bottom)); }
button.primary { font-size: 28px; padding: 18px 48px; border-radius: 12px;
  border: none; background: #1652f0; color: white; width: 100%; }
</style>
</head>
<body>
  <main>
    <button id="startBtn" class="primary">START</button>

    <section id="dashboard" hidden>
      <div id="chartPanel">
        <div class="card chartCard">
          <div class="axisY">Force</div>
          <canvas id="curve" width="300" height="150"></canvas>
          <div class="axisX">Stroke length</div>
        </div>
        <canvas id="scope" width="300" height="70"></canvas>
      </div>
      <div id="statPanel">
        <div class="cardRow2">
          <div class="card"><label>Time</label><span class="num" id="elapsed">0:00</span></div>
          <div class="card"><label>Stroke rate</label><span class="num"><span id="spm">--</span><span class="unit">spm</span></span></div>
        </div>
        <div class="card splitCard">
          <label>Split</label>
          <span class="num huge"><span id="pace">--:--</span><span class="unit">/500m</span></span>
        </div>
        <div class="cardRow2">
          <div class="card"><label>Distance</label><span class="num"><span id="dist">0</span><span class="unit">m</span></span></div>
          <div class="card"><label>Speed</label><span class="num"><span id="speed">--</span><span class="unit">km/h</span></span></div>
        </div>
        <div class="cardRow2">
          <div class="card"><label>GPS</label><span class="num sm" id="gps">no fix</span></div>
          <button id="stopBtn">STOP &amp; SAVE</button>
        </div>
      </div>
    </section>

    <section id="history" hidden>
      <h2>Sessions</h2>
      <ul id="sessionList"></ul>
      <button id="clearBtn">Clear history</button>
    </section>

    <section id="devtools">
      <button id="exportBtn" hidden>Export raw CSV</button>
    </section>
  </main>
  <script src="js/stroke-detector.js?v=20260912110220"></script>
<script src="js/stroke-tracker.js?v=20260912110220"></script>
<script src="js/app.js?v=20260912110220"></script>
</body>
</html>
